name: campus-una
services:
  api:
    build:
      context: ./api
      args:
        APP_VERSION: 1.0.0
    image: campus-api:1.0.0
    ports:
      - "${HTTP_PORT:-8080}:3000"
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}@db:5432/campus
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: campus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "campus"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
