name: campustareas
x-api: &api
  build:
    context: ./api
    args:
      APP_VERSION: ${APP_VERSION:-1.0.0}
  image: campus-api:${APP_VERSION:-1.0.0}
  environment:
    DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}@db:5432/campus
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
services:
  api1: *api
  api2: *api
  api3: *api
  balanceador:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: campus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "campus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
